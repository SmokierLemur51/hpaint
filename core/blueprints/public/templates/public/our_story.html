{% extends "public.html" %}

{% block staticFiles %}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
<script type="text/javascript" src="{{ url_for('static', filename='js/learn.js') }}"></script>
{% endblock staticFiles %}


{% block navbar %}
<!-- top navbar start -->
<nav class="navbar navbar-expand-lg mb-8 signature-color" >
  <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('public.index') }}">Higginbotham Painting</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">

              <li class="nav-item">
                  <a class="nav-link" aria-current="page" href="{{ url_for('public.services') }}">Services</a>
              </li>

              <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="{{ url_for('public.about') }}">About</a>
              </li>

              <li class="nav-item">
                  <a class="nav-link" aria-current="page" href="{{ url_for('public.contact') }}">Contact Us</a>
              </li>

          </ul>
          <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Ask a Question" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Ask</button>
          </form>
      </div>
  </div>
</nav>
{% endblock navbar %}

{% block main %}



{% endblock main %}
